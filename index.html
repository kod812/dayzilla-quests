<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квесты Dayzilla</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#121a24; --panel:#151d2b; --panel2:#1b2434;
    --line:#24304a; --line2:#2f3d5c;
    /* реальные размеры шторки; проставляются из JS в syncSheetVars */
    --sheetH:0px; --gripH:30px;
    --text:#e7edf7; --muted:#8494ad; --muted2:#64748b;
    --accent:#4ade80; --accent2:#22d3ee;
    --done:#4ade80; --active:#fbbf24; --open:#60a5fa; --locked:#5b6a85;
    --rail:190px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    font-size:14px;
  }
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}

  /* ---------- каркас ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header.top{
    display:flex;align-items:center;gap:12px;padding:10px 14px;
    background:linear-gradient(180deg,#141c29,#111823);
    border-bottom:1px solid var(--line);flex:0 0 auto;z-index:30;
  }
  .logo{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
  .logo b{font-size:17px;letter-spacing:.4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

  .stat{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .stat .num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .lbl{font-size:11px;color:var(--muted);line-height:1.15}
  /* кликабельный счётчик «доступно сейчас» */
  .stat.pick{
    background:none;border:1px solid transparent;border-radius:8px;
    padding:4px 8px;margin-left:2px;cursor:pointer;font-family:inherit;color:inherit;
    transition:background .15s,border-color .15s;
  }
  .stat.pick:hover{background:#182031;border-color:var(--line)}
  .stat.pick.on{background:#16263c;border-color:#2c4d70}

  .bar{width:150px;height:7px;border-radius:99px;background:#0b1017;border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--done),var(--accent2));width:0;transition:width .25s}
  .cstat{display:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  .grow{flex:1 1 auto}
  .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
  .tsep{width:1px;height:20px;background:var(--line2);margin:0 3px;flex:0 0 auto}
  .toolbar select.btn{padding-right:6px;cursor:pointer}

  .field{position:relative;display:flex;align-items:center}
  .field input{
    background:#0b1017;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px 7px 30px;width:210px;outline:none;transition:border-color .15s
  }
  .field input:focus{border-color:var(--accent2)}
  .field svg{position:absolute;left:9px;opacity:.55;pointer-events:none}

  .btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,color .15s
  }
  .btn:hover{background:#232e42;border-color:var(--line2)}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:#1d3a52;border-color:var(--accent2);color:#bff1ff}
  .btn.ghost{background:transparent}
  .btn.icon{padding:7px 9px;min-width:34px;text-align:center}
  .btn.danger:hover{border-color:#b91c1c;color:#fca5a5}

  /* ---------- рабочая область ---------- */
  main{flex:1 1 auto;display:flex;min-height:0;position:relative}

  .stage{flex:1 1 auto;position:relative;overflow:hidden;background:
     radial-gradient(1100px 520px at 55% -15%, #18233a 0%, transparent 62%), var(--bg);
     cursor:grab}
  .stage.drag{cursor:grabbing}
  #cv{width:100%;height:100%;display:block;touch-action:none;user-select:none}

  /* сетка */
  #grid line{stroke:#ffffff;stroke-opacity:.028;stroke-width:1}

  /* ---------- рельс веток ---------- */
  .rail{
    position:absolute;left:0;top:0;bottom:0;width:var(--rail);z-index:10;
    pointer-events:none;border-right:1px solid #1b2434;
    background:linear-gradient(90deg,#0d1117 0%,#0d1117 84%,rgba(13,17,23,0) 100%);
  }
  .rail-item{
    position:absolute;left:8px;right:8px;padding:6px 9px;border-radius:9px;
    background:rgba(21,29,43,.92);border:1px solid var(--line);
    pointer-events:auto;cursor:pointer;transition:border-color .15s,background .15s;
    overflow:hidden;
  }
  .rail-item:hover{border-color:var(--line2)}
  .rail-item .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-item .p{font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .rail-item .n{font-size:10px;color:#6f7f9c;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-item.off{opacity:.35}
  .rail-item.mini{padding:3px 9px;display:flex;align-items:center}
  .rail-item.mini .p,.rail-item.mini .n{display:none}
  .rail-item.mini .t{font-size:10.5px;margin:0}
  .lanelab .lane-label{pointer-events:auto;cursor:pointer;transition:fill .15s}
  .lanelab:hover .lane-label{fill:#93a6c6}
  .emptybox{cursor:pointer}
  .emptybox:hover rect{stroke:#55688f;fill:#151b28}

  /* ---------- узлы ---------- */
  .node{cursor:pointer}
  .node .nbox{fill:#18212f;stroke:#2a3650;stroke-width:1.4;transition:fill .15s,stroke .15s}
  .node:hover .nbox{stroke:#5c7ba8;fill:#1d2939}
  .node .nacc{stroke:none}
  .node .nname{fill:var(--text);font-size:13px;font-weight:600;pointer-events:none;text-anchor:middle}
  .node .nmeta{fill:var(--muted);font-size:10.5px;pointer-events:none;text-anchor:middle}
  .node .nunlock{fill:#fbbf24;font-size:10px;font-weight:600;pointer-events:none;text-anchor:middle}
  .nsep{stroke:#26324a;stroke-width:1}
  .nstat{font-size:12px;pointer-events:none;text-anchor:middle;font-weight:700}

  .node.s-done .nbox{fill:#11251b;stroke:#2f7a4d}
  .node.s-done .nname{fill:#a7f3c8}
  .node.s-active .nbox{fill:#2a2113;stroke:#a9791d}
  .node.s-active .nname{fill:#fde4a6}
  .node.s-open .nbox{stroke:#3d5f8e}
  .node.s-locked .nbox{fill:#151a24;stroke:#263041}
  .node.s-locked .nname{fill:#6b7a94;font-weight:500}
  .node.s-locked .nmeta{fill:#4d5a72}
  .node.sel .nbox{stroke:#e2e8f0;stroke-width:2.2;filter:drop-shadow(0 0 7px rgba(120,170,255,.45))}
  .node.dim{opacity:.16}
  .node.hit .nbox{stroke:#facc15;stroke-width:2.4}
  .node.ihl{opacity:1}
  .node.ihl .nbox{stroke:#fbbf24;stroke-width:2.6;filter:drop-shadow(0 0 7px rgba(251,191,36,.4))}

  .edge{fill:none;stroke:#2c3a54;stroke-width:2;transition:stroke .15s,opacity .15s,stroke-width .15s}
  .edge.e-open{stroke:#43628f}
  .edge.e-done{stroke:#2f7a4d}
  .edge.e-hi{stroke:#fbbf24;stroke-width:3.4;filter:drop-shadow(0 0 5px rgba(251,191,36,.5))}
  .edge.dim{opacity:.08}
  .lane-label{fill:#54637e;font-size:12px;font-weight:700;letter-spacing:2.6px;pointer-events:none}

  /* ---------- панель квеста ---------- */
  aside{
    flex:0 0 372px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:20
  }
  aside.empty{flex-basis:300px}
  /* панель квеста скрыта — карта занимает всю ширину */
  body.no-panel aside{display:none}
  body.no-panel .rail{
    background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 92%,rgba(13,17,23,0) 100%);
    border-right:none;
  }
  .aside-head{
    padding:13px 15px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#18212f,#141b27);flex:0 0 auto
  }
  .aside-head .eyebrow{font-size:10.5px;letter-spacing:1.7px;color:var(--muted2);text-transform:uppercase}
  .aside-head h2{margin:5px 0 0;font-size:19px;line-height:1.22}
  .aside-head .crumb{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:0 0 auto}

  .aside-body{overflow:auto;padding:14px 15px 26px;flex:1 1 auto}
  .aside-body::-webkit-scrollbar{width:9px}
  .aside-body::-webkit-scrollbar-thumb{background:#28344c;border-radius:9px}

  .statebtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
  .statebtns .btn{padding:8px 4px;font-size:12px;text-align:center}

  .sec{margin:16px 0 0}
  .sec>h4{
    margin:0 0 8px;font-size:10.5px;letter-spacing:1.7px;text-transform:uppercase;
    color:var(--muted2);display:flex;align-items:center;gap:8px
  }
  .sec>h4:after{content:"";flex:1;height:1px;background:var(--line)}

  ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  ul.clean li{
    background:var(--bg2);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:13px;line-height:1.4;position:relative;padding-left:28px
  }
  ul.clean li::before{
    content:"";position:absolute;left:10px;top:12px;width:7px;height:7px;border-radius:99px;background:#3b4a66
  }
  ul.clean li.rw::before{background:#c084fc}
  ul.clean li.nt::before{background:#fbbf24}
  ul.clean li.done{opacity:.5;text-decoration:line-through}

  ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  ul.tasks li{display:flex;align-items:flex-start;gap:9px;background:var(--bg2);
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;line-height:1.4;cursor:pointer}
  ul.tasks li:hover{border-color:var(--line2)}
  ul.tasks li .box{
    width:16px;height:16px;border-radius:5px;border:1.5px solid #3d4c68;flex:0 0 auto;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#06210f
  }
  ul.tasks li.on .box{background:var(--done);border-color:var(--done)}
  ul.tasks li.on span{opacity:.5;text-decoration:line-through}

  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;
    padding:5px 11px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}

  .linkrow{display:flex;flex-wrap:wrap;gap:6px}
  .qlink{
    background:var(--bg2);border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text)
  }
  .qlink:hover{border-color:var(--accent2);color:#bff1ff}
  .qlink.locked{opacity:.55}
  .qlink .n{color:var(--muted2);margin-right:6px}

  .note{font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-wrap;
    background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--line2);
    border-radius:7px;padding:9px 11px}
  .speech{margin:14px 0 0;font-size:13px;line-height:1.7;color:#c8d4e8;font-style:italic;
    background:#101a15;border:1px solid #1d3a2b;border-left:3px solid #2f7a4d;
    border-radius:8px;padding:12px 14px}
  .empty-note{font-size:12.5px;color:var(--muted2);font-style:italic}

  .placeholder{padding:24px 18px 20px;color:var(--muted);font-size:13px;line-height:1.6}
  .placeholder h3{margin:0 0 7px;font-size:15px;font-weight:600;color:var(--text);letter-spacing:.2px}
  .placeholder .lead{margin:0 0 22px;font-size:12.5px;color:var(--muted2);line-height:1.65}
  .placeholder .ktitle{margin:0 0 8px;font-size:10px;letter-spacing:1.7px;
    text-transform:uppercase;color:#5d6b85}
  .placeholder .keys{margin:0;padding:13px 14px;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;
    display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
  .placeholder .keys span{font-size:12.5px;color:#a9b7cd}
  /* подвал панели: ссылка прижата в правый нижний угол */
  .corner-link{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:flex-end;gap:7px;
    padding:11px 16px 13px;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,rgba(11,16,23,0),rgba(11,16,23,.55));
    font-size:12px;color:#63738f;text-decoration:none;letter-spacing:.2px;
    transition:color .15s;
  }
  .corner-link .cl-dot{
    width:5px;height:5px;border-radius:99px;background:#3d4f6d;
    transition:background .15s,box-shadow .15s;
  }
  .corner-link:hover{color:#8ef2ff}
  .corner-link:hover .cl-dot{background:var(--accent2);box-shadow:0 0 7px rgba(34,211,238,.85)}
  .placeholder .hint-note{margin:16px 0 0;padding-left:11px;
    border-left:2px solid var(--line2);
    font-size:11.5px;color:var(--muted2);line-height:1.6}
  .placeholder kbd{margin:0;background:#0b1017;border:1px solid var(--line2);
    border-bottom-width:2px;border-radius:6px;padding:2px 7px;min-width:24px;
    font-size:11px;font-family:inherit;color:var(--text);text-align:center;justify-self:start}

  /* ---------- зум ---------- */
  .zoomctl{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:15}
  .zoomctl .btn{background:rgba(21,29,43,.94);backdrop-filter:blur(4px)}
  .zoompct{
    position:absolute;right:14px;bottom:52px;z-index:15;font-size:11px;color:var(--muted);
    background:rgba(21,29,43,.9);border:1px solid var(--line);border-radius:7px;padding:3px 8px;
    font-variant-numeric:tabular-nums
  }

  /* список найденного */
  .results{
    position:absolute;left:14px;bottom:14px;width:302px;max-height:52%;
    display:flex;flex-direction:column;z-index:16;
    background:rgba(21,29,43,.97);border:1px solid var(--line2);border-radius:11px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);overflow:hidden;
  }
  .results[hidden]{display:none}
  .res-head{
    display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;
    border-bottom:1px solid var(--line);background:#18212f;
    font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);
  }
  .res-head b{color:var(--text);font-size:13px;letter-spacing:0}
  .res-x{
    margin-left:auto;background:none;border:none;color:var(--muted2);cursor:pointer;
    font-size:13px;line-height:1;padding:2px 4px;border-radius:5px;
  }
  .res-x:hover{background:#243049;color:var(--text)}
  .res-list{overflow:auto;padding:6px}
  .res-list::-webkit-scrollbar{width:8px}
  .res-list::-webkit-scrollbar-thumb{background:#28344c;border-radius:8px}
  .res-item{
    display:flex;gap:9px;align-items:center;width:100%;text-align:left;
    background:none;border:1px solid transparent;border-radius:8px;
    padding:7px 8px;cursor:pointer;color:var(--text);font-family:inherit;
  }
  .res-item:hover{background:#1d2939;border-color:var(--line)}
  .res-item .rb{width:4px;height:20px;border-radius:99px;flex:0 0 auto}
  .res-item .rt{min-width:0;overflow:hidden}
  .res-item .rn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res-item .rc{font-size:10.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res-empty{padding:12px;font-size:12px;color:var(--muted2)}

  /* ---------- база предметов ---------- */
  .idb{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(5,8,13,.74);backdrop-filter:blur(3px);
  }
  .idb[hidden]{display:none}
  .idb-box{
    width:min(580px,calc(100vw - 28px));max-height:min(80vh,740px);
    display:flex;flex-direction:column;overflow:hidden;
    background:#141b28;border:1px solid var(--line2);border-radius:13px;
    box-shadow:0 24px 70px rgba(0,0,0,.65);
  }
  .idb-head{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);background:#18212f}
  .idb-head .sub{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2)}
  .idb-head h3{margin:2px 0 0;font-size:14px;line-height:1.2}
  .idb-head b{margin-left:auto;font-size:15px;color:#fbbf24;font-variant-numeric:tabular-nums}
  .idb-x{
    background:none;border:none;color:var(--muted2);cursor:pointer;
    font-size:15px;line-height:1;padding:3px 7px;border-radius:6px
  }
  .idb-x:hover{background:#243049;color:var(--text)}
  .idb-tools{display:flex;padding:11px 14px 0}
  .idb-tools .field,.idb-tools .field input{width:100%}
  .idb-note{padding:8px 14px 0;font-size:11px;color:var(--muted2)}
  .idb-list{overflow:auto;padding:8px;margin-top:6px}
  .idb-list::-webkit-scrollbar{width:9px}
  .idb-list::-webkit-scrollbar-thumb{background:#28344c;border-radius:9px}
  .it-row{
    display:block;width:100%;text-align:left;background:none;border:1px solid transparent;
    border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--text);font-family:inherit
  }
  .it-row:hover{background:#1d2939;border-color:var(--line)}
  .it-row.on{background:#1b2434;border-color:#41557a}
  .it-top{display:flex;align-items:baseline;gap:10px}
  .it-name{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it-qty{margin-left:auto;font-size:12.5px;font-weight:700;color:#fbbf24;white-space:nowrap;font-variant-numeric:tabular-nums}
  .it-where{font-size:10.5px;color:var(--muted2);margin-top:3px}
  .it-quests{margin:2px 0 6px;padding-left:9px;border-left:2px solid #2b3852;display:grid;gap:3px}
  .it-q{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;
    border:1px solid transparent;border-radius:7px;padding:6px 8px;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:12px
  }
  .it-q:hover{background:#212c3d;border-color:var(--line)}
  .it-q .qb{width:3px;height:16px;border-radius:99px;flex:0 0 auto}
  .it-q .qn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it-q .qa{margin-left:auto;font-size:11px;color:var(--muted2);white-space:nowrap}
  .it-empty{padding:22px 12px;font-size:12px;color:var(--muted2);text-align:center}
  @media (max-width:820px){
    .idb-box{width:100vw;height:100dvh;max-height:none;border:none;border-radius:0}
    .idb-tools .field input{height:40px}
  }

  /* плашка подсветки над картой */
  .hlbar{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:18;
    display:flex;align-items:center;gap:9px;max-width:min(420px,calc(100% - 28px));
    padding:7px 8px 7px 13px;border-radius:99px;
    background:rgba(21,29,43,.96);border:1px solid #41557a;backdrop-filter:blur(4px);
    font-size:12px;color:var(--text);white-space:nowrap
  }
  .hlbar[hidden]{display:none}
  .hlbar span{overflow:hidden;text-overflow:ellipsis}
  .hlbar b{color:#fbbf24;font-weight:600}
  .hlbar button{
    flex:0 0 auto;background:#243049;border:none;border-radius:99px;color:var(--text);
    font-size:11px;padding:4px 9px;cursor:pointer;font-family:inherit
  }
  .hlbar button:hover{background:#31405e}
  @media (max-width:820px){ .hlbar{top:60px} }

  /* подсветка ветки при наведении на рельс */
  #nodes[data-hb] .node{opacity:.14}
  #nodes[data-hb] .node.hb{opacity:1}
  .rail-item.hb{border-color:var(--line2);background:#1d2939}

  /* свёрнутая ветка */
  .lanelab.collapsed .lane-label{fill:#5b6b8c}
  .lanelab .hit{fill:#fff;fill-opacity:0;cursor:pointer;transition:fill-opacity .15s}
  .lanelab.collapsed:hover .hit{fill-opacity:.05}
  .lanelab.collapsed:hover .lane-label{fill:#a9bbdb}
  .colmeta{fill:#5b6b8b;font-size:10.5px;font-weight:600;pointer-events:none;text-anchor:end}

  /* ручка шторки — на десктопе не нужна */
  .sheet-grip{
    display:none;position:absolute;top:-28px;left:0;right:0;height:28px;
    background:none;border:0;padding:0;cursor:grab;touch-action:none;
    place-items:center;
  }
  .sheet-grip i{
    display:block;width:48px;height:4px;border-radius:99px;background:#3d4b64;
    transition:background .15s,width .15s;
  }
  .sheet-grip:active{cursor:grabbing}
  .sheet-grip:active i{background:var(--accent2);width:58px}

  .toast{
    position:absolute;left:50%;top:18px;transform:translateX(-50%) translateY(-18px);
    display:flex;align-items:center;gap:11px;white-space:nowrap;
    background:rgba(21,29,43,.97);border:1px solid var(--line2);border-radius:11px;
    padding:11px 18px;font-size:13.5px;
    box-shadow:0 12px 34px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;z-index:40
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* успешное событие: зелёная галочка и рамка */
  .toast.good{
    background:linear-gradient(180deg,#17301f,#122417);
    border-color:#2f7a4d;color:#b7f3d0;
    font-size:14.5px;font-weight:600;padding:13px 22px 13px 14px;border-radius:13px;
    box-shadow:0 14px 38px rgba(0,0,0,.6),0 0 0 1px rgba(74,222,128,.10);
  }
  .toast .ti{
    width:27px;height:27px;flex:0 0 auto;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#4ade80,#22c55e);color:#06210f;
    font-size:16px;font-weight:700;line-height:1
  }

  @media (max-width:1400px){
    header.top{gap:9px;padding:8px 10px}
    .btn{padding:6px 9px;font-size:13px}
    .field input{width:150px}
    .stat .num{font-size:15px}
    .bar{width:110px}
    aside{flex-basis:340px}
  }
  @media (max-width:1180px){
    .stat .lbl{display:none}
    .stat{gap:0}
    .bar{display:none}
    aside{flex-basis:320px}
  }
  @media (max-width:1080px){
    #bExport,#bImport,.tsep{display:none}
  }
  @media (max-width:980px){
    aside{flex-basis:300px}
    .toolbar .wide{display:none}
  }
  @media (max-width:820px){
    .stat,.bar{display:none}
    .cstat{display:inline}
  }
  @media (max-width:700px){
    #fStatus{display:none}
  }

  /* ================= ТЕЛЕФОН =================
     Десктоп выше не трогаем — всё, что ниже, только до 820px. */
  @media (max-width:820px){
    /* шапка в две строки: поиск во всю ширину, кнопки лентой */
    header.top{flex-wrap:wrap;gap:8px;padding:8px 10px}
    .logo b{font-size:15px}
    .grow{display:none}
    .toolbar{
      order:9;width:100%;justify-content:flex-start;
      overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    }
    .toolbar::-webkit-scrollbar{display:none}
    .toolbar .wide{display:block;order:-1;flex:1 0 100%;margin-bottom:1px}
    .field input{width:100%}
    .toolbar .btn{flex:0 0 auto}
    .tsep{display:none}

    /* рельс веток: горизонтальная лента чипсов */
    .rail{
      position:absolute;left:0;right:0;top:0;bottom:auto;
      width:auto;height:46px;border-right:none;border-bottom:1px solid #1b2434;
      display:flex;align-items:center;gap:6px;
      padding:0 8px;pointer-events:auto;overflow-x:auto;overflow-y:hidden;
      scrollbar-width:none;
      background:linear-gradient(180deg,rgba(13,17,23,.97) 76%,rgba(13,17,23,0) 100%);
    }
    .rail::-webkit-scrollbar{display:none}
    .rail-item{
      position:static;flex:0 0 auto;width:auto;height:auto;
      padding:5px 12px;border-radius:99px;display:flex;align-items:center;
    }
    .rail-item .n,.rail-item .p{display:none}
    .rail-item.mini{display:flex;padding:5px 12px}
    .rail-item.mini .t{font-size:12.5px}
    .rail-item .t{font-size:12.5px}

    /* панель квеста превращается в шторку снизу */
    aside{
      position:fixed;left:0;right:0;top:auto;bottom:0;
      width:auto;flex:none;height:64vh;max-height:64vh;
      border-left:none;border-top:1px solid var(--line2);
      border-radius:16px 16px 0 0;
      box-shadow:0 -14px 42px rgba(0,0,0,.68);
      transform:translateY(100%);
      transition:transform .28s cubic-bezier(.32,.72,.35,1);
      z-index:80;
    }
    aside.open{transform:translateY(0)}
    aside.dragging{transition:none}
    body.no-panel aside{display:flex}
    /* ручка торчит над шторкой и служит за неё — подложка делает её заметной */
    .sheet-grip{
      display:grid;top:-30px;height:30px;
      background:linear-gradient(180deg,#1d2739 62%,rgba(29,39,57,0));
      border-radius:13px 13px 0 0;
    }
    .sheet-grip i{width:52px;height:5px;background:#61729a}

    /* Список найденого — на телефоне под поиском сверху. Снизу он перекрывал
       кнопки зума: панель растянута во всю ширину и растёт вверх, а кнопки
       зума сидят в правом нижнем углу ровно под ней. */
    .results{left:8px;right:8px;width:auto;top:52px;bottom:auto;max-height:38%}
    /* Открытая шторка поднимает кнопки зума вверх, и список найденого накрывает
       их — между лентой веток и кнопками остаётся около 50px. Пока открыт поиск
       и видна шторка, зум убираем: вернётся вместе с закрытием списка. */
    body.sheet-open.has-results .zoomctl,
    body.sheet-open.has-results .zoompct{display:none}
    /* зум и проценты встают столбиком над шторкой — ручка занимает самый низ.
       Высоты берём из --sheetH/--gripH: их проставляет JS по факту
       (sheetMetrics), иначе на телефоне с адресной строкой кнопки уезжают под шторку. */
    body.sheet-open .zoomctl{bottom:calc(var(--sheetH) + var(--gripH) + 12px)}
    body.sheet-open .zoompct{bottom:calc(var(--sheetH) + var(--gripH) + 46px)}
    /* Страховка от наезда: шторка с z-index 80 перекрывала кнопки (у них был 15),
       из-за чего нижний край кнопок и список найденного нельзя было нажать.
       Всё, что лежит поверх карты, поднимаем выше шторки. */
    .zoomctl,.zoompct,.results,.hlbar,.toast{z-index:85}
    .toast{top:54px;white-space:normal;max-width:88%;text-align:center}
  }
</style>

<script src="quests-data.js"></script>
<script src="structure.js"></script>
<script>
(() => {
"use strict";

const SVGNS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const PALETTE = ["#f0b429","#4ade80","#ef4444","#22d3ee","#a78bfa","#f472b6","#60a5fa","#fb923c"];

/* ============================== 1. МОДЕЛЬ ============================== */

function buildModel(raw, st){
  const rawByTitle = new Map(raw.branches.map(b => [b.title, b]));
  const useWiki = !(st && st.wikiCrossLinks === false);

  // если файла схемы нет — строим ветки из вики как есть
  const spec = (st && st.branches && st.branches.length)
    ? st.branches
    : raw.branches.map(b => ({ id:b.title, title:b.title, match:[b.title], root:true, _wiki:b }));

  const branches = spec.map((s, i) => {
    let src = s._wiki || null;
    if (!src) for (const m of (s.match || [s.title])) { if (rawByTitle.has(m)) { src = rawByTitle.get(m); break; } }
    const list = s.quests || (src ? src.quests : []);
    return {
      id: s.id || s.title,
      title: s.title,
      color: s.color || PALETTE[i % PALETTE.length],
      short: s.short || s.title,
      npc: s.npc || "",
      // описание берём только из structure.js: текст с вики местами расходится
      // с реальной схемой сервера и с мусором от парсера
      intro: s.intro || "",
      root: !!s.root,
      needs: s.requires || [],
      empty: !list.length,
      _src: src,
      quests: list.map((q, n) => ({
        id: (s.id || s.title) + "#" + (n + 1),
        branch: s.title, num: n + 1,
        name: q.name || ("Квест " + (n + 1)),
        heading: q.heading || q.name || ("Квест " + (n + 1)),
        objectives: q.objectives || [], rewards: q.rewards || [],
        notes: q.notes || [], timeLimit: q.timeLimit || "",
        speech: q.speech || "",
        repeatable: !!q.repeatable, cooldown: q.cooldown || "",
        deps: new Set(), unlocks: []
      }))
    };
  });

  const byTitle = new Map();
  branches.forEach(b => {
    byTitle.set(b.title, b);
    if (b._src) byTitle.set(b._src.title, b);
  });
  const qIndex = new Map();
  branches.forEach(b => b.quests.forEach(q => qIndex.set(q.id, { q, branch:b })));

  const find = (title, anchor) => {
    const b = byTitle.get(title);
    if (!b || !b.quests.length) return null;
    if (!anchor) return b.quests[b.quests.length - 1];
    const a = anchor.replace(/\s+/g, " ").trim();
    return b.quests.find(q => q.heading === a)
        || b.quests.find(q => q.name === a)
        || b.quests.find(q => a.indexOf(q.name) >= 0)
        || null;
  };

  // --- кандидаты в связи "квест Q требует D" ---
  const cands = [];
  const add = (q, dep) => { if (q && dep && q !== dep) cands.push({ q, dep }); };

  const byId = new Map(branches.map(b => [b.id, b]));

  branches.forEach(b => {
    for (let i = 1; i < b.quests.length; i++) add(b.quests[i], b.quests[i - 1]);  // цепочка
    if (b.root || !b.quests.length) return;                // root — доступна сразу
    b.needs.forEach(need => {                               // «Открывает: …»
      const a = Array.isArray(need) ? need : [need];
      const src = byId.get(a[0]);
      if (!src || !src.quests.length) return;
      add(b.quests[0], a.length > 1 ? src.quests[a[1] - 1] : src.quests[src.quests.length - 1]);
    });
  });

  // перекрёстные ссылки из примечаний вики: [[Ветка#Квест]]
  if (useWiki) branches.forEach(b => {
    if (!b._src || b.quests.length !== b._src.quests.length) return;
    b.quests.forEach((q, n) => {
      (b._src.quests[n].links || []).forEach(l => add(q, find(l.branch, l.anchor)));
    });
  });

  // --- отсекаем связи, создающие цикл ---
  const reached = new Map();
  const reach = q => {
    if (reached.has(q)) return reached.get(q);
    const s = new Set();
    for (const d of q.deps) {
      s.add(d);
      const t = qIndex.get(d);
      if (t) reach(t.q).forEach(x => s.add(x));
    }
    reached.set(q, s);
    return s;
  };
  const added = [];
  cands.forEach(c => {
    if (reach(c.dep).has(c.q.id)) return;
    c.q.deps.add(c.dep.id);
    reached.clear();
    added.push(c);
  });
  added.forEach(c => c.dep.unlocks.push(c.q));

  const quests = [];
  branches.forEach(b => b.quests.forEach(q => quests.push(q)));
  return { branches, quests, byTitle, qIndex };
}

/* ============================== 2. СОСТОЯНИЕ ============================== */

const LS = "dzq.progress.v2";
let MODEL = null;
let RAW = window.QUEST_DATA || null;
let STRUCT = window.QUEST_STRUCTURE || null;

const S = {
  done: new Set(), active: new Set(), tasks: {},   // tasks[id] = [bool,...]
  onlyOpen: false, status: "all", noPanel: false,
  query: "", collapsed: new Set(),
  sel: null, hot: null,
  itemsHl: null, itemsName: null                   // предмет, квесты которого подсвечены
};

function load(){
  try {
    const j = JSON.parse(localStorage.getItem(LS) || "{}");
    S.done   = new Set(j.done || []);
    S.active = new Set(j.active || []);
    S.tasks  = j.tasks || {};
    S.onlyOpen = !!j.onlyOpen;
    S.noPanel  = !!j.noPanel;
  } catch(e){}
  // на file:// браузер может запретить localStorage — предупредим один раз
  try {
    localStorage.setItem(LS + ".probe", "1");
    localStorage.removeItem(LS + ".probe");
  } catch(e){
    setTimeout(() => toast("Прогресс не сохранится: браузер блокирует localStorage. Запусти serve.ps1"), 900);
  }
}
function save(){
  try {
    localStorage.setItem(LS, JSON.stringify({
      done:[...S.done], active:[...S.active], tasks:S.tasks,
      onlyOpen:S.onlyOpen, noPanel:S.noPanel
    }));
  } catch(e){}
}

function qStatus(q){
  if (S.done.has(q.id)) return "done";
  if (S.active.has(q.id)) return "active";
  for (const d of q.deps) if (!S.done.has(d)) return "locked";
  return "open";
}

/* ============================== 3. ГЕОМЕТРИЯ ============================== */

const NW = 186, NH = 88, GX = 52, GY = 62, PAD = 26;
const CH = 26;                          // высота свёрнутой полосы — одна строка
const CHIT_W = 460;                     // ширина кликабельной зоны свёрнутой полосы
const DEFAULT_ZOOM = 0.70;      // масштаб при открытии карты
const RAIL_W = 190;
const POS = new Map();
let BOUNDS = { x:0, y:0, w:1, h:1 };

function layout(){
  let y = PAD;
  MODEL.branches.forEach(b => {
    if (S.collapsed.has(b.id)){                 // свёрнутая ветка — одна строчка
      b._y = y; b._h = CH;
      b.quests.forEach(q => POS.delete(q.id));
      y += CH + 20;                              // 20, а не GY: заголовок следующей
      return;                                   // ветки рисуется на 12px выше полосы
    }
    b.quests.forEach((q,i) => {
      POS.set(q.id, { x: PAD + i * (NW + GX), y, w:NW, h:NH, b });
    });
    b._y = y; b._h = NH;
    y += NH + GY;
  });
  const open = MODEL.branches.filter(b => !S.collapsed.has(b.id));
  const maxN = Math.max(1, ...open.map(b => b.quests.length));
  BOUNDS = { x:0, y:0, w: PAD*2 + maxN*(NW+GX) - GX, h: y - GY + PAD };
}

/* ============================== 4. КАМЕРА ============================== */

const cam = { x:0, y:0, k:1 };
const stage = $("#stage");

// панель квеста: скрыта — карта на всю ширину
function highlightBranch(i, on){
  const b = MODEL.branches[i]; if (!b) return;
  const items = $("#rail").querySelectorAll(".rail-item");
  items[i].classList.toggle("hb", on);
  const nodes = $("#nodes");
  if (on){
    nodes.setAttribute("data-hb", b.title);
    const hb = new Set(b.quests.map(q => q.id));
    nodes.querySelectorAll(".node").forEach(el => {
      if (hb.has(el.dataset.id)) el.classList.add("hb");
    });
  } else {
    nodes.removeAttribute("data-hb");
    nodes.querySelectorAll(".node").forEach(el => el.classList.remove("hb"));
  }
}

// Навести камеру на текущий квест. Если ничего не выбрано — берём первый доступный.
function focusCurrent(){
  let id = S.sel;
  if (!id){
    id = (MODEL.quests.find(q => qStatus(q) === "open") || MODEL.quests[0] || {}).id;
    if (id) select(id);
  }
  if (!id || !POS.has(id)) return;
  centerOn(id, Math.max(cam.k, 0.85));
  const q = MODEL.qIndex.get(id) && MODEL.qIndex.get(id).q;
  if (q) toast(`${q.num}. ${q.name}`, "◎");
}

// На телефоне панель — шторка снизу, а не колонка справа.
function isSheet(){ return window.matchMedia("(max-width:820px)").matches; }

function openSheet(on){
  const a = $("#side"); if (!a) return;
  a.classList.toggle("open", !!on);
  a.classList.remove("dragging");
  a.style.transform = "";
  document.body.classList.toggle("sheet-open", !!on);
  syncSheetVars();
}

function setPanel(show, keepClosed){
  S.noPanel = !show;
  document.body.classList.toggle("no-panel", S.noPanel);
  $("#fPanel").classList.toggle("on", !S.noPanel);
  if (isSheet()) openSheet(show && !keepClosed);
  save();
  applyCam();
}

// Помним, где остановился: возврат на ту же точку при следующем открытии.
let camSaveT = null;
function saveCam(){
  clearTimeout(camSaveT);
  camSaveT = setTimeout(() => {
    try { localStorage.setItem("dzq.cam", JSON.stringify(cam)); } catch(e){}
  }, 400);
}
function restoreCam(){
  try {
    const c = JSON.parse(localStorage.getItem("dzq.cam") || "null");
    if (c && isFinite(c.x) && isFinite(c.y) && c.k > .1 && c.k < 3) return c;
  } catch(e){}
  return null;
}

function applyCam(){
  $("#world").setAttribute("transform", `translate(${cam.x} ${cam.y}) scale(${cam.k})`);
  $("#zoompct").textContent = Math.round(cam.k*100) + "%";
  saveCam();
  const w = stage.clientWidth;
  $("#grid").innerHTML = "";
  const step = 46 * cam.k;
  if (step > 13){
    let s = "", ox = cam.x % step, oy = cam.y % step;
    for (let x = ox; x < w; x += step) s += `M${x.toFixed(1)} 0V2000`;
    for (let yy = oy; yy < stage.clientHeight; yy += step) s += `M0 ${yy.toFixed(1)}H${w}`;
    $("#grid").innerHTML = `<path d="${s}" fill="none"/>`;
  }
  positionRail();
}

// «Выровнять» и кнопка, и F — возвращают стандартный вид: масштаб 70%
// и карта прижата к началу слева.
function fit(){
  resetView(PAD);
}
function resetView(x0){
  cam.k = isSheet() ? .45 : DEFAULT_ZOOM;      // на телефоне 70% — слишком крупно
  const top = isSheet() ? 54 : 10;              // сверху лента веток
  cam.x = (isSheet() ? 14 : RAIL_W + 18) - x0 * cam.k;
  cam.y = Math.max(top, top + (stage.clientHeight - BOUNDS.h * cam.k) / 2);
  applyCam();
}
function zoomAt(px, py, f){
  const wx = (px - cam.x)/cam.k, wy = (py - cam.y)/cam.k;
  cam.k = clamp(cam.k * f, .18, 2.6);
  cam.x = px - wx*cam.k; cam.y = py - wy*cam.k;
  applyCam();
}
// Высота шторки и её ручки в CSS-переменных. Раньше 64vh был зашит в трёх
// местах в CSS и ещё раз как .64 в centerOn — числа не совпадали (486 против 434),
// и на телефоне с адресной строкой кнопки зума уезжали под шторку.
// Теперь меряем реальную высоту один раз и читаем её отовсюду.
function sheetMetrics(){
  const a = $("#side"), g = $("#sheetGrip");
  const h = (isSheet() && a) ? a.offsetHeight : 0;
  const grip = (isSheet() && g && g.offsetHeight) ? g.offsetHeight : 30;
  return { h, grip };
}
function syncSheetVars(){
  const m = sheetMetrics();
  const st = document.documentElement.style;
  st.setProperty("--sheetH", m.h + "px");
  st.setProperty("--gripH", m.grip + "px");
}
// Насколько снизу на карте занято шторкой — для центрирования камеры.
function sheetCover(){
  if (!isSheet() || !document.body.classList.contains("sheet-open")) return 0;
  const m = sheetMetrics();
  return m.h + m.grip;
}
function centerOn(id, k){
  const p = POS.get(id); if (!p) return;
  if (k) cam.k = clamp(k, .3, 1.8);
  // на телефоне видно не всю сцену: сверху лента веток, снизу шторка
  const top = isSheet() ? 54 : 0;
  const bot = sheetCover();
  const visH = Math.max(80, stage.clientHeight - top - bot);
  cam.x = stage.clientWidth/2  - (p.x + p.w/2)*cam.k;
  cam.y = top + visH/2 - (p.y + p.h/2)*cam.k;
  applyCam();
}

/* ============================== 5. РЕНДЕР СЦЕНЫ ============================== */

function bez(x1,y1,x2,y2){
  // контрольные точки не должны вылезать за концы, иначе кривая уходит в пустоту
  const d = Math.min(Math.max(38, Math.abs(x2-x1) * .55), Math.abs(x2-x1));
  return `M${x1} ${y1} C${x1+d} ${y1} ${x2-d} ${y2} ${x2} ${y2}`;
}

// Ширина текста внутри карточки: 186 минус небольшие поля по краям.
const TXT_W = 162;

// Линейка для замера: считаем не символы, а реальную ширину в пикселях.
// Шрифт задаём явно: селектор .node .nname сюда не применится — линейка
// лежит прямо в #nodes, а не внутри группы карточки, и иначе меряла бы
// кеглем по умолчанию 16px вместо реальных 13px.
let MEASURE = null;
function measureText(){
  if (MEASURE) return MEASURE;
  MEASURE = document.createElementNS(SVGNS, "text");
  MEASURE.setAttribute("data-measure", "1");
  MEASURE.style.visibility = "hidden";
  MEASURE.style.fontSize = "13px";
  MEASURE.style.fontWeight = "600";
  MEASURE.style.fontFamily = getComputedStyle(document.body).fontFamily;
  if (!MEASURE.isConnected) $("#cv").appendChild(MEASURE);   // #cv не перезаписывается
  return MEASURE;
}
function textWidth(t){
  const m = measureText();
  m.textContent = t;
  return m.getComputedTextLength();
}

// Перенос по реальной ширине. Больше maxLines строк не влезает — тогда многоточие.
function wrapToWidth(text, maxW, maxLines){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = "";
  for (const w of words){
    const cand = cur ? cur + " " + w : w;
    if (textWidth(cand) > maxW && cur){ lines.push(cur); cur = w; }
    else cur = cand;
  }
  if (cur) lines.push(cur);

  if (lines.length <= maxLines) return lines;

  const keep = lines.slice(0, maxLines);
  let t = keep[maxLines - 1];
  while (t.length > 1 && textWidth(t + "…") > maxW) t = t.slice(0, -1);
  keep[maxLines - 1] = t.trimEnd() + "…";
  return keep;
}

// Стрелки между разными ветками не рисуем: на карте они лишь шумят.
// Связь «этот квест открывает тот» остаётся в карточке квеста (Открывает / Требует).
const SHOW_CROSS_BRANCH_ARROWS = false;

function edgeList(){
  const out = [];
  MODEL.quests.forEach(q => {
    q.deps.forEach(d => {
      const a = POS.get(q.id), b = POS.get(d);
      if (!a || !b) return;
      const dep = MODEL.qIndex.get(d);
      const cross = q.branch !== (dep ? dep.q.branch : q.branch);
      if (cross && !SHOW_CROSS_BRANCH_ARROWS) return;
      // Стрелка идёт СЛЕВА НАПРАВО: от квеста-предшественника к зависимому от него.
      const x1 = b.x + b.w, y1 = b.y + b.h/2, x2 = a.x, y2 = a.y + a.h/2;
      out.push({ from:d, to:q.id, cross, d: bez(x1,y1,x2,y2) });
    });
  });
  return out;
}
const EDGES = [];

function drawScene(){
  layout();
  EDGES.length = 0; EDGES.push(...edgeList());

  // заголовки веток + заглушки для пустых веток
  $("#lanes").innerHTML = MODEL.branches.map((b,i) => {
    if (S.collapsed.has(b.id)){
      const d = b.quests.filter(q => S.done.has(q.id)).length;
      // свёрнутая ветка: название и прогресс в одну строку — двум строкам не хватает полосы
    return `<g class="lanelab collapsed" data-b="${i}">
        <rect class="hit" x="${PAD-10}" y="${b._y-5}" width="${CHIT_W}" height="${CH+10}" rx="8"/>
        <text class="lane-label" x="${PAD}" y="${b._y+18}">${esc(b.title.toUpperCase())}</text>
        <text class="colmeta" x="${CHIT_W+PAD-20}" y="${b._y+18}">${d} / ${b.quests.length} · раскрыть</text></g>`;
    }
    const lab = `<g class="lanelab" data-b="${i}">
      <text class="lane-label" x="${PAD}" y="${b._y - 12}">${esc(b.title.toUpperCase())}</text></g>`;
    if (!b.empty) return lab;
    return lab + `<g class="emptybox" data-b="${i}">
      <rect x="${PAD}" y="${b._y}" width="330" height="${NH}" rx="9"
            fill="#121722" stroke="#33415c" stroke-width="1.4" stroke-dasharray="6 5"/>
      <text x="${PAD+20}" y="${b._y+32}" fill="#6b7a94" font-size="12.5">Ветка пока пустая</text>
      <text x="${PAD+20}" y="${b._y+50}" fill="#4d5a72" font-size="11">впиши квесты в structure.js</text>
    </g>`;
  }).join("");

  // связи
  $("#edges").innerHTML = EDGES.map((e,i) =>
    `<path class="edge" data-i="${i}" d="${e.d}" marker-end="url(#ar-idle)"/>`
  ).join("");

  // узлы (свёрнутые ветки сюда не попадают — их позиции нет в POS)
  $("#nodes").innerHTML = MODEL.quests.filter(q => POS.has(q.id)).map(q => {
    const p = POS.get(q.id);
    const lines = wrapToWidth(q.num + ". " + q.name, TXT_W, 2);
    const nm = (q.objectives.length ? `${q.objectives.length} цел.` : "0 цел.")
             + " · " + q.rewards.length + " нагр.";
    const meta = (q.timeLimit ? shortTime(q.timeLimit) + " · " : "") + nm;
    const u = unlockOf(q);
    const line = u ? `← после: ${esc(u.short)} · ${u.num}`
                   : (q.repeatable && q.cooldown ? `↻ повтор: ${esc(shortTime(q.cooldown))}` : "");
    return `<g class="node" data-id="${esc(q.id)}" transform="translate(${p.x} ${p.y})">
      <rect class="nbox" x="0" y="0" width="${p.w}" height="${p.h}" rx="9"/>
      <rect class="nacc" x="0" y="0" width="4.5" height="${p.h}" rx="2" fill="${p.b.color}"/>
      ${lines.map((l,i) => `<text class="nname" x="${p.w/2}" y="${22 + i*16}">${esc(l)}</text>`).join("")}
      <line class="nsep" x1="14" y1="${p.h-36}" x2="${p.w-12}" y2="${p.h-36}"/>
      <text class="nmeta" x="${p.w/2}" y="${p.h-22}">${esc(meta)}</text>
      ${line ? `<text class="nunlock" x="${p.w/2}" y="${p.h-8}">${line}</text>` : ""}
      <text class="nstat" x="${p.w-19}" y="${p.h-10}"></text>
      <title>${esc(q.name)}${u ? `\nОткрывается после: ${u.title} · квест ${u.num}` : ""}</title>
    </g>`;
  }).join("");

  // подгоняем однострочные подписи под ширину карточки
  $("#nodes").querySelectorAll(".node").forEach(n => {
    fitText(n.querySelector(".nmeta"), TXT_W);
    fitText(n.querySelector(".nunlock"), TXT_W);
  });

  $("#lanes").querySelectorAll("[data-b]").forEach(el =>
    el.addEventListener("click", () => openBranch(+el.dataset.b)));

  refresh();
}

// Квест, который открывает ЭТОТ квест, но лежит в другой ветке.
// Раньше это была стрелка через всю карту — теперь подпись прямо на карточке.
function unlockOf(q){
  let out = null;
  q.deps.forEach(id => {
    const e = MODEL.qIndex.get(id);
    if (!out && e && e.q.branch !== q.branch) out = e;
  });
  if (!out) return null;
  return { short: out.branch.short || out.branch.title, title: out.branch.title, num: out.q.num };
}

function shortTime(t){
  const s = String(t || "").trim();
  if (!s) return "";
  if (/неогранич/i.test(s)) return "без срока";
  const h = s.match(/(\d+)\s*(час|ч\.|дн|день|дней)/i);
  if (!h) return "без срока";
  const n = h[1], u = h[2].toLowerCase();
  if (/час|ч\./.test(u)) return n + " ч";
  return n + " дн";
}

// Обрезка текста по фактической ширине — последний рубеж, чтобы ничего не вылезало.
function fitText(el, maxW){
  if (!el || !el.getComputedTextLength) return;
  let s = el.textContent;
  if (!s || el.getComputedTextLength() <= maxW) return;
  el.textContent = "";
  while (s.length > 0){
    el.textContent = s + "…";
    if (el.getComputedTextLength() <= maxW) return;
    s = s.slice(0, -1);
  }
  el.textContent = "";
}

const NODE_EL = new Map(), EDGE_EL = [];
function cacheEls(){
  NODE_EL.clear();
  $("#nodes").querySelectorAll(".node").forEach(el => NODE_EL.set(el.dataset.id, el));
  EDGE_EL.length = 0;
  $("#edges").querySelectorAll(".edge").forEach(el => EDGE_EL[+el.dataset.i] = el);
}

const STAT = { done:"✓", active:"▶", open:"•", locked:"🔒" };
const STATC = { done:"#4ade80", active:"#fbbf24", open:"#60a5fa", locked:"#5b6a85" };
const MARK = { done:"ar-done", open:"ar-open", locked:"ar-idle", active:"ar-open" };

function matches(q, query){
  if (!query) return true;
  const b = MODEL.byTitle.get(q.branch);
  const s = [q.name, q.heading, b ? b.title : "", q.branch, b ? b.npc : "",
             q.objectives, q.rewards, q.notes, q.timeLimit]
            .join(" ").toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => s.includes(w));
}

function refresh(){
  cacheEls();
  syncFoldAll();
  let done = 0, openNow = 0;

  MODEL.quests.forEach(q => {
    const st = qStatus(q), el = NODE_EL.get(q.id);
    if (!el) return;                        // ветка свёрнута — узла нет
    let dim = false;
    if (S.query) dim = dim || !matches(q, S.query);
    if (S.onlyOpen  && st !== "open" && st !== "active") dim = true;
    if (S.status !== "all" && st !== S.status) dim = true;
    // подсветка по предмету сильнее любых фильтров: видно ровно его квесты
    let hl = false;
    if (S.itemsHl){ hl = S.itemsHl.has(q.id); dim = !hl; }

    el.setAttribute("class", "node s-" + st + (S.sel === q.id ? " sel" : "")
      + (dim ? " dim" : "") + (hl ? " ihl" : "")
      + (S.query && matches(q, S.query) ? " hit" : ""));
    el.querySelector(".nstat").textContent = STAT[st];
    el.querySelector(".nstat").setAttribute("fill", STATC[st]);
    el.querySelector(".nstat").setAttribute("opacity", st === "open" ? ".35" : "1");

    if (st === "done") done++;
    if (st === "open") openNow++;
    el.style.display = "";
  });

  EDGES.forEach((e,i) => {
    const el = EDGE_EL[i]; if (!el) return;
    const eTo = MODEL.qIndex.get(e.to), eFrom = MODEL.qIndex.get(e.from);
    if (!eTo || !eFrom) return;              // ветка свёрнута — связи нет
    const t = eTo.q, st = qStatus(t);
    let cls = "edge", mk = MARK[st];
    if (st === "done") { cls += " e-done"; }
    else if (st !== "locked") { cls += " e-open"; }
    if (S.sel && (e.from === S.sel || e.to === S.sel)) { cls += " e-hi"; mk = "ar-hi"; }
    let dim = false;
    if (S.query) dim = dim || !(matches(t, S.query) || matches(eFrom.q, S.query));
    if (S.onlyOpen && st !== "open" && st !== "active") dim = true;
    if (S.status !== "all" && st !== S.status) dim = true;
    if (dim) cls += " dim";
    el.setAttribute("class", cls);
    el.setAttribute("marker-end", `url(#${mk})`);
  });

  $("#sDone").textContent  = done;
  $("#sTotal").textContent = MODEL.quests.length;
  $("#sOpen").textContent  = openNow;
  $("#cStat").textContent  = done + "/" + MODEL.quests.length;
  renderResults();
  $("#sBar").style.width = (MODEL.quests.length ? done/MODEL.quests.length*100 : 0) + "%";
  positionRail(done);
  if (S.sel) renderSide();
}

/* Список найденного: то, что нашлось по запросу, в одном месте. */
function renderResults(){
  const box = $("#results");
  if (!MODEL || !S.query){ box.hidden = true; document.body.classList.remove("has-results"); return; }
  // свёрнутые ветки тоже ищем: клик по строке раскроет нужную ветку (см. select)
  const found = MODEL.quests.filter(q => matches(q, S.query));
  box.hidden = false;
  document.body.classList.add("has-results");
  $("#resCount").textContent = found.length;
  if (!found.length){
    $("#resList").innerHTML = `<div class="res-empty">Ничего не найдено</div>`;
    return;
  }
  const rank = { open:0, active:1, done:2, locked:3 };
  found.sort((a,b) => {
    const A = MODEL.qIndex.get(a.id).branch, B = MODEL.qIndex.get(b.id).branch;
    const ai = MODEL.branches.indexOf(A), bi = MODEL.branches.indexOf(B);
    return ai - bi || a.num - b.num || (rank[qStatus(a)] - rank[qStatus(b)]);
  });
  $("#resList").innerHTML = found.map(q => {
    const b = MODEL.qIndex.get(q.id).branch;
    const st = qStatus(q);
    return `<button class="res-item" data-go="${esc(q.id)}">
      <span class="rb" style="background:${b.color}"></span>
      <span class="rt">
        <span class="rn">${q.num}. ${esc(q.name)}</span>
        <span class="rc">${esc(b.title)} · ${({done:"выполнен",active:"в работе",open:"доступен",locked:"закрыт"})[st]}${POS.has(q.id) ? "" : " · свёрнута"}</span>
      </span></button>`;
  }).join("");
  $("#resList").querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => select(el.dataset.go, true)));
}

function positionRail(done){
  if (!MODEL) return;
  const items = $("#rail").querySelectorAll(".rail-item");
  MODEL.branches.forEach((b,i) => {
    const it = items[i]; if (!it) return;
    const p = it.querySelector(".p");
    if (p) p.textContent = b.empty ? "пусто"
      : `${b.quests.filter(q => S.done.has(q.id)).length} / ${b.quests.length}`;
    // на телефоне чипы лежат лентой — привязки к координатам карты не нужно
    if (isSheet()){ it.style.top = ""; it.style.height = ""; it.classList.remove("mini"); return; }
    const h = Math.max(22, b._h * cam.k);
    it.style.top = (cam.y + b._y * cam.k + 2) + "px";
    it.style.height = h + "px";
    it.classList.toggle("mini", h < 46);
  });
}
function buildRail(){
  $("#rail").innerHTML = MODEL.branches.map((b,i) => `
    <div class="rail-item" data-bi="${i}">
      <div class="t" style="color:${b.color}">${esc(b.title)}</div>
      ${b.npc ? `<div class="n">📍 ${esc(b.npc)}</div>` : ""}
      <div class="p" data-p="${i}"></div>
    </div>`).join("");
  $("#rail").querySelectorAll(".rail-item").forEach(it => {
    it.addEventListener("click", () => openBranch(+it.dataset.bi));
    // наведение подсвечивает всю ветку на карте
    it.addEventListener("mouseenter", () => highlightBranch(+it.dataset.bi, true));
    it.addEventListener("mouseleave", () => highlightBranch(+it.dataset.bi, false));
    it.addEventListener("dblclick", () => { S.collapsed.clear(); buildRail(); drawScene(); refresh(); });
  });
}

/* ============================== 6. ПАНЕЛЬ КВЕСТА ============================== */

const side = $("#side");

function renderSide(){
  const id = S.sel;
  if (!id || !MODEL.qIndex.has(id)){
    side.className = "empty";
    $("#sideBody").innerHTML = `<div class="placeholder">
      <h3>Выбери квест на карте</h3>
      <p class="lead">Клик по карточке — открыть квест. Клик по названию ветки слева
         или по её подписи на карте — открыть всю ветку целиком.</p>
      <p class="ktitle">Управление</p>
      <div class="keys">
        <kbd>колесо</kbd><span>зум</span>
        <kbd>/</kbd><span>поиск по квестам и предметам</span>
        <kbd>F</kbd><span>выровнять карту целиком</span>
        <kbd>G</kbd><span>навести камеру на текущий квест</span>
        <kbd>H</kbd><span>скрыть или показать эту панель</span>
        <kbd>Esc</kbd><span>закрыть</span>
      </div>
      <p class="hint-note">Некоторые квесты не имеют целей и (или) наград,
         все будет заполняться со временем.</p>
    </div>`;
    return;
  }
  const q = MODEL.qIndex.get(id).q, b = MODEL.qIndex.get(id).branch;

function onAct(act, q){
  if (act === "done"){ S.done.add(q.id); S.active.delete(q.id); }
  else if (act === "active"){ if (S.done.has(q.id)) S.done.delete(q.id); S.active.add(q.id); }
  else if (act === "reset"){ S.done.delete(q.id); S.active.delete(q.id); delete S.tasks[q.id]; }
  else if (act === "goto"){ centerOn(q.id, Math.max(cam.k, .85)); toast("Показано на карте"); }
  else if (act === "branch"){
    const b = MODEL.branches.find(x => x.title === bTitle(q));
    S.collapsed.clear(); if (b) S.collapsed.add(b.id);
    drawScene(); buildRail(); refresh();
    toast("Осталась только ветка: " + bTitle(q));
  }
  else if (act === "copy"){ copyQuest(q); }
  save(); refresh();
}
function bTitle(q){ return MODEL.qIndex.get(q.id).branch.title; }

function copyQuest(q){
  const b = bTitle(q);
  const L = [];
  L.push(`${b} — квест ${q.num}: «${q.name}»`, "─".repeat(40));
  if (q.timeLimit) L.push(`Срок: ${q.timeLimit}`);
  if (q.objectives.length) L.push("", "Цели:", ...q.objectives.map(o => "• " + o));
  if (q.rewards.length)    L.push("", "Награды:", ...q.rewards.map(o => "• " + o));
  if (q.notes.length)      L.push("", "Примечания:", ...q.notes.map(o => "• " + o));
  const txt = L.join("\n");
  (navigator.clipboard?.writeText(txt) || Promise.reject())
    .then(() => toast("Скопировано в буфер обмена"))
    .catch(() => { window.prompt("Скопируй текст:", txt); });
}

function select(id, fly){
  const b = MODEL.qIndex.get(id)?.branch;      // квест может лежать в свёрнутой ветке

/* ============================== 7. БАЗА ПРЕДМЕТОВ ============================== */

/* Цель становится предметом только если это читается однозначно. Всё сомнительное
   отбрасывается молча — лучше не показать, чем показать не то:
     нет « - N »            → место или деньги («20.000 рублей.», «Озеро Орловье.»)
     « - 330/12980 »       → координаты, а не количество
     « - в комендатуре …»  → описание места, а не предмет
     начинается с глагола   → действие («Убить зомби медиков — 3 шт.»)                */
/* Цель становится предметом только если это читается однозначно. Всё сомнительное
   отбрасывается молча — лучше не показать, чем показать не то:
     нет « - N »            → место или деньги («20.000 рублей.», «Озеро Орловье.»)
     « - 330/12980 »       → координаты, а не количество
     « - в комендатуре …»  → описание места, а не предмет
     начинается с глагола   → действие («Убить зомби медиков — 3 шт.»)                */

// Разделитель между названием и количеством. Вики пишет через дефис,
// structure.js — через тире-em. Берём последнее совпадение, как раньше.
const QTY_SEP = /\s[-—–−]\s/;

// Глаголы, после которых цели нет в базе. Список не выдуман: каждая строка
// проверена пользователем поимённо, включая «Поймать», «Закрыть магазин»
// и «Прогуляться» из «Пути рыбака».
const ACT_VERBS = new Set([
  "убить","крафт","сделать","уничтожить",   // вики
  "поймать","выточить","наколоть",           // путь рыбака — действия
  "закрыть","прогуляться"                   // путь рыбака — сходить и закрыть
]);

// «Принести упакованную коробку…» — действие, но предмет внутри строки:
// глагол убираем, остальное оставляем как есть.
const STRIP_VERB = "принести";
// …кроме этой строки: пользователь решил её в базу не тащить.
const ITEM_SKIP = new Set(["бумажку"]);
// После снятия глагола остаётся «упакованную коробку…» — винительный падеж,
// из-за которого поиск по «коробка» этот предмет не находит. Названия приводим
// к тому, как они выглядят в игре; форма взята с «Гейши» и «Ретто».
const ITEM_RENAME = new Map([
  ["упакованную коробку с картами «игровые карты»", "Упакованная коробка с картами «Игровые карты»"],
  ["упакованную коробку с картами «лесные стражи»", "Упакованная коробка с картами «Лесные стражи»"]
]);

function parseObjective(t){
  const s = String(t || "").trim();
  const seps = [...s.matchAll(new RegExp(QTY_SEP.source, "g"))];
  if (!seps.length) return null;                       // место или деньги («20.000 рублей.»)
  const last = seps[seps.length - 1];
  let name = s.slice(0, last.index).trim();
  const qty = s.slice(last.index + last[0].length).trim();
  if (/^\d+\s*\/\s*\d+$/.test(qty)) return null;        // координаты: 330/12980

  const head = (name.split(/\s+/)[0] || "").toLowerCase().replace(/ё/g,"е");
  if (ACT_VERBS.has(head)) return null;                  // цель-действие
  if (head === STRIP_VERB){
    name = name.slice(name.indexOf(" ") + 1).trim();      // «Принести X» -> «X»
    if (ITEM_SKIP.has(name.toLowerCase())) return null;
    name = ITEM_RENAME.get(name.toLowerCase()) || name;
  }
  const m = /^(\d+)(?:\s+(.*))?$/.exec(qty);              // точка в единице остаётся — как в источнике
  if (!m) return null;                                    // количество не начинается с цифры
  return { name, n:+m[1], unit:(m[2] || "шт.").trim() };
}

function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  return a > 10 && a < 20 ? many : b > 1 && b < 5 ? few : b === 1 ? one : many;
}

// Сколько всего нужно по незакрытым квестам. Закрытые выпадают сами — по мере
// прохождения база пустеет, это и есть её смысл.
function buildItemBase(){
  const map = new Map();
  MODEL.quests.forEach(q => {
    if (qStatus(q) === "done") return;
    (q.objectives || []).forEach(t => {
      const it = parseObjective(t);
      if (!it) return;
      let e = map.get(it.name);
      if (!e){ e = { name:it.name, n:0, unit:it.unit, quests:[] }; map.set(it.name, e); }
      e.n += it.n;
      e.quests.push({ id:q.id, n:it.n, unit:it.unit });
    });
  });
  return [...map.values()].sort((a,b) => a.name.localeCompare(b.name, "ru"));
}

let ITEMBASE = [];

function renderItems(){
  const words = $("#idbQ").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = words.length
    ? ITEMBASE.filter(e => words.every(w => e.name.toLowerCase().includes(w)))
    : ITEMBASE;

  $("#idbCount").textContent = rows.length;
  // предмет встречается в нескольких квестах — считать надо разные квесты, не ссылки
  const qids = new Set();
  ITEMBASE.forEach(e => e.quests.forEach(x => qids.add(x.id)));
  $("#idbNote").textContent = ITEMBASE.length
    ? `${ITEMBASE.length} ${plural(ITEMBASE.length,"предмет","предмета","предметов")} — `
      + `всё, что нужно собрать для ${qids.size} ${plural(qids.size,"незакрытого квеста","незакрытых квестов","незакрытых квестов")}. `
      + `Действия и координаты сюда не попадают.`
    : "Все квесты с предметами закрыты.";

  const list = $("#idbList");
  if (!rows.length){ list.innerHTML = `<div class="it-empty">Ничего не найдено</div>`; return; }

  list.innerHTML = rows.map(e => {
    const on = S.itemsName === e.name;
    const qs = e.quests.map(x => {
      const hit = MODEL.qIndex.get(x.id); if (!hit) return "";
      const q = hit.q;                            // в qIndex лежит пара {q, branch}
      return `<button class="it-q" type="button" data-go="${esc(x.id)}">
        <span class="qb" style="background:${hit.branch.color}"></span>
        <span class="qn">${esc(hit.branch.title)} · ${q.num}. ${esc(q.name)}</span>
        <span class="qa">${x.n} ${esc(x.unit)}</span></button>`;
    }).join("");
    return `<div>
      <button class="it-row${on?" on":""}" type="button" data-item="${esc(e.name)}">
        <span class="it-top">
          <span class="it-name">${esc(e.name)}</span>
          <span class="it-qty">${e.n} ${esc(e.unit)}</span>
        </span>
        <span class="it-where">${e.quests.length} ${plural(e.quests.length,"квест","квеста","квестов")}</span>
      </button>
      ${on ? `<div class="it-quests">${qs}</div>` : ""}
    </div>`;
  }).join("");

  list.querySelectorAll("[data-item]").forEach(el => el.addEventListener("click", () => {
    const name = el.dataset.item;
    if (S.itemsName === name) clearItemHl();
    else setItemHl(name);
    renderItems();
  }));
  list.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => {
    closeItems();
    select(el.dataset.go, true);
  }));
}

// Подсветка на карте держится и после закрытия базы — иначе смысл теряется.
// Снимается плашкой над картой или повторным кликом по тому же предмету.
function setItemHl(name){
  const e = ITEMBASE.find(x => x.name === name);
  if (!e) return;
  S.itemsName = name;
  S.itemsHl = new Set(e.quests.map(x => x.id));
  // ветки с такими квестами могли быть свёрнуты — раскрываем, иначе подсветки не видно
  let opened = false;
  e.quests.forEach(x => {
    const b = MODEL.qIndex.get(x.id)?.branch;
    if (b && S.collapsed.delete(b.id)) opened = true;
  });
  if (opened){ drawScene(); buildRail(); }
  syncHlbar();
  refresh();
}
function clearItemHl(){
  S.itemsName = null; S.itemsHl = null;
  syncHlbar(); refresh();
}
function syncHlbar(){
  const bar = $("#hlbar");
  bar.hidden = !S.itemsName;
  if (S.itemsName) $("#hlbarTxt").innerHTML = `Предмет <b>${esc(S.itemsName)}</b> — подсвечены его квесты`;
}

function openItems(){
  if (!MODEL) return;
  ITEMBASE = buildItemBase();
  $("#idb").hidden = false;
  renderItems();
  $("#idbQ").focus();
}
function closeItems(){ $("#idb").hidden = true; }

/* ============================== 8. СОБЫТИЯ ============================== */

function toast(msg, icon){
  const t = $("#toast");
  t.className = "toast" + (icon ? " good" : "");
  t.innerHTML = (icon ? `<span class="ti">${icon}</span>` : "") + `<span>${esc(msg)}</span>`;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), icon ? 2800 : 1900);
}

// Жесты по карте: один палец — таскание, два — щипок (сведение/разведение).
let drag = null;
const PTR = new Map();        // активные указатели: id -> точка в координатах #cv
let pinch = null;             // опорные значения щипка

function cvPoint(e){
  const r = $("#cv").getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// Второй палец превращает жест в щипок. Запоминаем масштаб и ту мировую точку,
// что оказалась под серединой пальцев, — к ней карта и прижимается до конца жеста.
function beginPinch(){
  const p = [...PTR.values()];
  if (p.length < 2) return;
  const cx = (p[0].x + p[1].x)/2, cy = (p[0].y + p[1].y)/2;
  const d0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  if (d0 < 8) return;                        // пальцы рядом — рано мерить щипок
  pinch = { d0:d0, k0:cam.k, wx:(cx - cam.x)/cam.k, wy:(cy - cam.y)/cam.k };
  if (drag) drag.moved = true;               // щипок не должен превратиться в тап
}

// Расстояние между пальцами задаёт масштаб, их середина — сдвиг. Оба значения
// считаем от начала жеста, иначе карта уезжает от пальцев и «плывёт».
function updatePinch(){
  const p = [...PTR.values()];
  if (p.length < 2 || !pinch) return false;
  const cx = (p[0].x + p[1].x)/2, cy = (p[0].y + p[1].y)/2;
  const d  = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
  cam.k = clamp(pinch.k0 * d/pinch.d0, .18, 2.6);
  cam.x = cx - pinch.wx*cam.k;
  cam.y = cy - pinch.wy*cam.k;
  applyCam();
  return true;
}

function endPointers(){
  pinch = null;
  if (PTR.size === 1){                       // палец остался — тащим им дальше
    const p = [...PTR.values()][0];
    drag = { x:p.x, y:p.y, ox:cam.x, oy:cam.y, moved:true, id:null };
  } else drag = null;
  if (!PTR.size) stage.classList.remove("drag");
}

$("#cv").addEventListener("pointerdown", e => {
  if (e.button !== 0 && e.pointerType === "mouse") return;
  PTR.set(e.pointerId, cvPoint(e));
  try { $("#cv").setPointerCapture(e.pointerId); } catch(err){}
  stage.classList.add("drag");
  if (PTR.size === 1){
    const p = PTR.get(e.pointerId);
    drag = { x:p.x, y:p.y, ox:cam.x, oy:cam.y, moved:false, id:e.target.closest(".node")?.dataset.id };
  } else beginPinch();
});
$("#cv").addEventListener("pointermove", e => {
  if (!PTR.has(e.pointerId)) return;
  const p = cvPoint(e);
  PTR.set(e.pointerId, p);
  if (pinch){ updatePinch(); return; }
  if (!drag) return;
  const dx = p.x - drag.x, dy = p.y - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  cam.x = drag.ox + dx; cam.y = drag.oy + dy;
  applyCam();
});
$("#cv").addEventListener("pointerup", e => {
  PTR.delete(e.pointerId);
  const tap = drag && !drag.moved && PTR.size === 0;
  const id  = drag && drag.id;
  endPointers();
  if (tap){
    if (id) select(id);
    else if (isSheet()) openSheet(false);   // тап по пустому месту — закрыть шторку
  }
});
$("#cv").addEventListener("pointercancel", e => { PTR.delete(e.pointerId); endPointers(); });
$("#cv").addEventListener("wheel", e => {
  e.preventDefault();
  const r = $("#cv").getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.13 : 1/1.13);
}, { passive:false });

$("#zIn").onclick  = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.25);
$("#zOut").onclick = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.25);
$("#zFit").onclick = () => fit();

$("#q").addEventListener("input", e => { S.query = e.target.value.trim(); refresh(); });
$("#resClear").onclick = () => { S.query = ""; $("#q").value = ""; refresh(); };

// база предметов
$("#bItems").onclick = openItems;
$("#idbX").onclick = closeItems;
$("#idbQ").addEventListener("input", renderItems);
$("#hlbarX").onclick = clearItemHl;
$("#idb").addEventListener("pointerdown", e => { if (e.target === $("#idb")) closeItems(); });
// Esc и «/» внутри базы не должны долетать до общих горячих клавиш карты
document.addEventListener("keydown", e => {
  if ($("#idb").hidden) return;
  if (e.key === "Escape"){ closeItems(); e.stopImmediatePropagation(); }
  else if (e.key === "/") e.stopImmediatePropagation();
});
$("#sOpenBtn").onclick = () => {
  S.onlyOpen = !S.onlyOpen;
  $("#fOnlyOpen").classList.toggle("on", S.onlyOpen);
  $("#sOpenBtn").classList.toggle("on", S.onlyOpen);
  save(); refresh();
  toast(S.onlyOpen ? "Показаны только доступные квесты" : "Показаны все квесты");
};
// Кнопка «свернуть всё» живёт по общему состоянию: ветку можно свернуть и из карточки,
// и двойным кликом — подпись не должна расходиться с реальностью.
function syncFoldAll(){
  const btn = $("#fFoldAll"); if (!btn || !MODEL) return;
  const live = MODEL.branches.filter(b => b.quests.length);
  const allFolded = live.length > 0 && live.every(b => S.collapsed.has(b.id));
  const txt = allFolded ? "Развернуть все" : "Свернуть все";
  if (btn.textContent !== txt) btn.textContent = txt;
  btn.classList.toggle("on", allFolded);
}
$("#fFoldAll").onclick = () => {
  const live = MODEL.branches.filter(b => b.quests.length);
  const allFolded = live.every(b => S.collapsed.has(b.id));
  S.collapsed.clear();
  if (!allFolded) live.forEach(b => S.collapsed.add(b.id));
  drawScene(); buildRail(); refresh();
  fit();                       // карта стала намного меньше — подгоняем камеру
  toast(allFolded ? "Все ветки развёрнуты" : "Все ветки свёрнуты");
};
$("#fOnlyOpen").onclick = e => { S.onlyOpen = !S.onlyOpen; e.target.classList.toggle("on", S.onlyOpen); save(); refresh(); };
$("#fStatus").onchange = e => { S.status = e.target.value; refresh(); };
$("#fPanel").onclick = () => setPanel(S.noPanel);
$("#bReset").onclick = () => {
  if (!confirm("Сбросить весь прогресс по всем квестам?")) return;
  S.done.clear(); S.active.clear(); S.tasks = {}; save(); refresh(); toast("Прогресс сброшен");
};

$("#bExport").onclick = () => {
  const blob = new Blob([JSON.stringify({ done:[...S.done], active:[...S.active], tasks:S.tasks }, null, 1)],
    { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `dayz-quests-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Файл прогресса скачан");
};
$("#bImport").onclick = () => $("#fileProg").click();
$("#fileProg").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      S.done = new Set(j.done || []); S.active = new Set(j.active || []); S.tasks = j.tasks || {};
      save(); refresh(); toast("Прогресс загружен");
    } catch(err){ alert("Не получилось прочитать файл: " + err.message); }
  };
  rd.readAsText(f); e.target.value = "";
};

/* ---- Шторка на телефоне: тянем за ручку вверх или вниз ---- */
(function sheetDrag(){
  const grip = $("#sheetGrip"), panel = $("#side");
  if (!grip || !panel) return;
  let pid = null, y0 = 0, dy = 0, h = 0, lastY = 0, lastT = 0, vel = 0, moved = false;

  grip.addEventListener("pointerdown", e => {
    if (!isSheet()) return;
    pid = e.pointerId; y0 = lastY = e.clientY; lastT = performance.now();
    dy = 0; vel = 0; moved = false; h = panel.offsetHeight || 1;
    panel.classList.add("dragging");
    try { grip.setPointerCapture(pid); } catch(err){}
  });

  grip.addEventListener("pointermove", e => {
    if (pid === null || e.pointerId !== pid) return;
    const now = performance.now();
    dy = e.clientY - y0;
    vel = (e.clientY - lastY) / Math.max(1, now - lastT);
    lastY = e.clientY; lastT = now;
    if (Math.abs(dy) > 6) moved = true;
    // немного можно перетянуть и выше открытого положения — выглядит живо
    dy = Math.max(-40, Math.min(dy, h));
    panel.style.transform = "translateY(" + dy + "px)";
    if (e.cancelable) e.preventDefault();
  });

  const finish = e => {
    if (pid === null || (e && e.pointerId !== pid)) return;
    pid = null;
    panel.classList.remove("dragging");
    // Тап разворачиваем здесь же. Раньше это делал click после pointerup,
    // и тот же тап переключал шторку дважды: закрывал и сразу открывал.
    if (!moved){ openSheet(!panel.classList.contains("open")); return; }
    // короткий резкий флик решает всё, медленное — по пройденному расстоянию
    const wasOpen = panel.classList.contains("open");
    const goOpen = vel < -.3 ? true : vel > .3 ? false
                 : (wasOpen ? dy < -h * .3 : dy > h * .28);
    openSheet(goOpen);
  };
  grip.addEventListener("pointerup", finish);
  grip.addEventListener("pointercancel", finish);

  // Тап уже разобран выше; сюда попадает только Enter/пробел (detail === 0)
  // и «закрывающий» клик после перетаскивания.
  grip.addEventListener("click", e => {
    if (!isSheet()) return;
    if (moved){ moved = false; return; }
    if (e.detail === 0) openSheet(!panel.classList.contains("open"));
  });

  // перевернули телефон или сменили окно — пересобираем положение шторки
  window.addEventListener("resize", () => {
    syncSheetVars();
    if (isSheet()) openSheet(panel.classList.contains("open"));
  });
})();

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape"){ if (document.activeElement === $("#q")) $("#q").blur(); else { S.sel = null; renderSide(); refresh(); } }
  else if ((e.key === "f" || e.key === "F" || e.key === "а" || e.key === "А") && document.activeElement !== $("#q")) fit();
  else if ((e.key === "h" || e.key === "H" || e.key === "р" || e.key === "Р") && document.activeElement !== $("#q")) setPanel(S.noPanel);
  else if ((e.key === "g" || e.key === "G" || e.key === "п" || e.key === "П") && document.activeElement !== $("#q")) focusCurrent();
});
window.addEventListener("resize", applyCam);

/* ============================== 9. СТАРТ ============================== */

function boot(data, st){
  RAW = data; STRUCT = st || null;
  MODEL = buildModel(data, STRUCT);
  load();
  if (S.onlyOpen) $("#fOnlyOpen").classList.add("on");
  setPanel(!S.noPanel, true);      // на телефоне шторка на старте закрыта
  drawScene();
  buildRail();
  renderSide();
  setView();
  // в фоновой вкладке rAF может не сработать — подстрахуемся
  setTimeout(setView, 60);
  window.addEventListener("load", setView);
}
function setView(){
  const saved = restoreCam();                 // возвращаем прошлый вид, если есть
  if (saved){ cam.x = saved.x; cam.y = saved.y; cam.k = saved.k; applyCam(); return; }
  // свёрнутая ветка не имеет карточек на карте — берём ту, что развёрнута
  const root = MODEL.branches.find(b => b.root && POS.has(b.quests[0]?.id))
           || MODEL.branches.find(b => POS.has(b.quests[0]?.id));
  if (!root) { fit(); centerOnEmpty(); return; }
  resetView(POS.get(root.quests[0].id).x);
}
function centerOnEmpty(){
  cam.k = .7;
  cam.x = RAIL_W + 40;
  cam.y = 30;
  applyCam();
}

if (RAW && RAW.branches) boot(RAW, STRUCT);
else {
  $("#sideBody").innerHTML = `<div class="placeholder"><b>Не найден файл quests-data.js</b><br><br>
    Запусти <code>sync-wiki.ps1</code>, чтобы скачать квесты с вики, или загрузи свой JSON:
    <div class="linkrow" style="margin-top:12px">
      <button class="qlink" id="bData">Загрузить quests.json</button></div></div>`;
  $("#bData").onclick = () => $("#fileData").click();
}
$("#fileData").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { boot(JSON.parse(rd.result), STRUCT); toast("Загружено: " + f.name); }
    catch(err){ alert("Файл не подходит: " + err.message); }
  };
  rd.readAsText(f); e.target.value = "";
};

})();
</script>
